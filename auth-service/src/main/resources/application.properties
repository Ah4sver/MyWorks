spring.application.name=auth-service
server.port=8080

spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

app.kafka.topic.verification-codes=verification-codes

app.verification.code-ttl-minutes=5
app.verification.code-length=6

app.jwt.secret=dGVzdC10YXNrLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLW1pbi0yNTYtYml0cw==
app.jwt.expiration-minutes=30

logging.level.com.example.authtest=DEBUG
logging.level.org.springframework.security=INFO